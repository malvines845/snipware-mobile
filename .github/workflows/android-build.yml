name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ensures sdkmanager, platform-tools, the compileSdk platform, build-tools,
      # and cmake are present regardless of what the runner image ships with.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1'

      # Installs the NDK used to build fuzzy_search.cpp and links it into the
      # SDK so AGP's auto-detection (no ndkVersion pin in build.gradle.kts) finds it.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true
          local-cache: true

      # This repo doesn't commit a Gradle Wrapper jar -- see README.md
      # ("CI / GitHub Actions") for why -- so Gradle is installed directly
      # instead of relying on ./gradlew.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snipware-debug-apk
          path: app/build/outputs/apk/debug/*.apk
