# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# NDK: build native (C++) libraries for these ABIs. Trim this list (e.g. to just
# arm64-v8a) during development to speed up incremental builds.
SNIPWARE_ABIS=arm64-v8a,armeabi-v7a,x86_64
